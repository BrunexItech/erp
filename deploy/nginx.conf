# Inside the production stack: one entry point that sends /api to the backend
# and everything else to the web app.

# Behind Cloudflare the visitor's address arrives in CF-Connecting-IP.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
# Whatever sits in front (Cloudflare, Caddy, the host's nginx) terminates
# HTTPS and says so in X-Forwarded-Proto; pass that on unchanged.
map $http_x_forwarded_proto $client_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 12m;   # attachments are up to 10 MB

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_read_timeout 120s;
    }

    location = /health { proxy_pass http://backend:8000/health/ready; }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }
}

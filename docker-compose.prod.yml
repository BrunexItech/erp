# Production stack. Settings come from the .env file next to this one
# (copy .env.production.example to .env and fill it in).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The app listens on 127.0.0.1:${APP_PORT} only. Put it on the internet with
# either the server's existing web server (see README) or the bundled Caddy:
#
#   docker compose -f docker-compose.prod.yml --profile caddy up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: erp
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://erp:${POSTGRES_PASSWORD}@postgres:5432/erp
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      APP_URL: https://${DOMAIN:?set DOMAIN in .env}
      API_PUBLIC_URL: https://${DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@${DOMAIN}}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Business Suite}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media   # logos, product pictures, attachments (backed up by scripts/backup.sh)
    # Bring the database up to date, then serve.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  erp_postgres_data:
  caddy_data:
